name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# No secrets are needed anywhere in this workflow; every value below is a dummy.
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rose
          POSTGRES_USER: rose
          POSTGRES_PASSWORD: rose
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rose -d rose" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.4.22
        env:
          MINIO_ROOT_USER: minio-local
          MINIO_ROOT_PASSWORD: minio-local-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://rose:rose@localhost:5432/rose
      CACHE_URL: redis://localhost:6379/1
      S3_TEST_ENDPOINT: http://localhost:9000
      REQUIRE_S3_TESTS: "1"
      REQUIRE_PG_DUMP: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - name: Site dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Test tool dependencies
        run: npm audit --audit-level=high
        working-directory: e2e

  end-to-end:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: Install
        run: npm ci
        working-directory: e2e
      - name: Browser tests
        # Uses the Chrome already installed on the runner.
        run: npx playwright test
        working-directory: e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color app worker
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
