# Weekly, grouped dependency updates. Every update still has to pass the checks workflow.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
