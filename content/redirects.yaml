status: draft - needs club approval
# Committed, so it never names the organisation: the sources are the previous
# site's sitemap and navigation, given here as paths only.
source_url:
  - previous-site:/sitemap.xml
  - previous-site:/
notes: >-
  Every public address of the previous site, mapped to where it lives now. Paths
  only, no names, so this one file is committed (tests check every mapping). An
  old path ending in /* covers everything under it. Deliberately not mapped, so
  they fall through to the normal not-found page: the empty shop (/category/*,
  /cart-page, /checkout), Wix system and template pages (/thank-you-page, /search,
  /items-1/*), the members' login pages (/memberlogin/*), and paths that are the
  same on both sites (/faq, /about, /events, /rentals, /membership).
redirects:
  # Main navigation
  - {from: /home, to: /}
  - {from: /staff, to: /about/staff}
  - {from: /gallery, to: /journal}
  - {from: /calendar, to: /events}
  - {from: /guest-membership, to: /guests}
  - {from: /educational, to: /education}
  - {from: /directions, to: "/visit#directions"}
  - {from: /what-to-expect, to: "/visit#expect"}
  - {from: /volunteer, to: /get-involved/volunteer}
  - {from: /donate, to: /get-involved/donate}
  - {from: /contact-us, to: /contact}
  - {from: /rental, to: /rentals}
  # Events, bookings and schedules
  - {from: /event-details/*, to: /events}
  - {from: /schedule, to: /events}
  - {from: /book-online, to: /events}
  - {from: /service-page/*, to: /events}
  - {from: /booking-calendar/*, to: /events}
  - {from: /booking-form, to: /events}
  # Pricing plan pages
  - {from: /plans-pricing, to: /membership}
  - {from: /first-friday, to: /membership}
  - {from: /community-membership, to: /membership}
  - {from: /educational-event-only, to: /membership}
  - {from: /limited-one-visit-per-month, to: /membership}
  - {from: /rose-visit-any-rose-event, to: /membership}
  - {from: /trial-memberships, to: /membership}
  # Documents linked from What To Expect, Contact Us, Volunteer and the footer
  - {from: /_files/ugd/bd1bc6_dd105f94e2ac42f4b20a0ee01c4203f2.pdf, to: /house-rules}
