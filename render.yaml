# Render Blueprint: STAGING. Production lives in render.production.yaml and is
# created separately, only when the club approves launch (docs/ops/deploy.md).
#
# Each environment runs one Docker image (./Dockerfile) as three services:
#   web     gunicorn; Django serves the site, the API, the admin and media views
#   worker  Celery (email, image processing, exports)
#   beat    Celery beat, exactly one instance (reminders, retention, backups)
# plus Render Postgres and Render Key Value (Redis).
#
# Secrets are never written here. Render does NOT prompt for `sync: false`
# values inside environment groups (Render docs: "You can't define an environment
# variable with sync: false in an environment group"), so the entries below are
# a list only. After creating the Blueprint, add each value by hand in the
# dashboard under Environment Groups > <env>-secrets, then deploy. A blank value
# stops the pre-deploy check, which names the missing setting:
#   <env>-secrets  DJANGO_SECRET_KEY (50+ random chars), DJANGO_ALLOWED_HOSTS,
#                  DJANGO_CSRF_TRUSTED_ORIGINS and SITE_URL (https), DJANGO_ADMIN_PATH
#                  (not "admin/"), SITE_DISPLAY_NAME, SITE_SHORT_NAME, the six S3_*
#                  values (two different buckets), POSTMARK_SERVER_TOKEN,
#                  EMAIL_SENDER_ADDRESS, CONTACT_NOTIFY_EMAIL, and in production
#                  BACKUP_AGE_RECIPIENT.
# A secret key:  python3 -c "import secrets; print(secrets.token_urlsafe(64))"
# The plans below are paid plans; creating this Blueprint creates billable
# resources, so it is applied by hand, never by CI.

projects:
  - name: rose
    environments:
      - name: staging
        envVarGroups:
          - name: rose-staging-settings
            envVars:
              - key: DJANGO_ENV
                value: staging
              - key: DJANGO_DEBUG
                value: "false"
              - key: DJANGO_TRUSTED_PROXY_COUNT
                value: "1"
              # The same services as production: R2 buckets (staging's own) and Postmark.
              # In an emergency, preview mode can stand in for both (docs/ops/deploy.md).
              - key: STORAGE_BACKEND
                value: s3
              - key: S3_REGION
                value: auto
              # Staging takes in-person payments only; the sandbox cannot run here.
              - key: PAYMENT_PROVIDERS
                value: manual
              - key: EMAIL_PROVIDER
                value: postmark
              - key: EMAIL_SENDER_NAME
                value: Rose
              - key: MERCHANT_DISPLAY_NAME
                value: Rose
              # Staging holds demo data only. Render's own Postgres backups cover it;
              # the encrypted nightly dump needs BACKUP_AGE_RECIPIENT and is for production.
              - key: BACKUP_ENABLED
                value: "false"
              - key: FEED_ENABLED
                value: "true"
              # Username for the site-wide staging password prompt. Not a secret on its own.
              - key: STAGING_BASIC_AUTH_USER
                value: preview
          - name: rose-staging-secrets
            envVars:
              - key: DJANGO_SECRET_KEY
                sync: false
              # The club's name on the website, in the member app and in the admin, and its
              # short form for tight spots. Entered in the dashboard so it is never written
              # into the repository. Email, receipts and the authenticator stay "Rose" above.
              - key: SITE_DISPLAY_NAME
                sync: false
              - key: SITE_SHORT_NAME
                sync: false
              - key: DJANGO_ALLOWED_HOSTS
                sync: false
              - key: DJANGO_CSRF_TRUSTED_ORIGINS
                sync: false
              - key: DJANGO_ADMIN_PATH
                sync: false
              - key: SITE_URL
                sync: false
              # Generated by Render; read it under Environment Groups to share with the club.
              - key: STAGING_BASIC_AUTH_PASSWORD
                generateValue: true
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: S3_PUBLIC_BUCKET
                sync: false
              - key: S3_PRIVATE_BUCKET
                sync: false
              - key: S3_PUBLIC_BASE_URL
                sync: false
              - key: POSTMARK_SERVER_TOKEN
                sync: false
              - key: EMAIL_SENDER_ADDRESS
                sync: false
              - key: CONTACT_NOTIFY_EMAIL
                sync: false
        databases:
          - name: rose-staging-db
            plan: basic-256mb
            postgresMajorVersion: "16"
            ipAllowList: []
        services:
          - type: keyvalue
            name: rose-staging-cache
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: []
          - type: web
            name: rose-staging-web
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            numInstances: 1
            healthCheckPath: /healthz
            # The safety checks, then migrations (backend/scripts/predeploy.sh, in the image's
            # working directory). A script, because Render runs this without a shell.
            preDeployCommand: ./scripts/predeploy.sh
            envVars: &staging-env
              - fromGroup: rose-staging-settings
              - fromGroup: rose-staging-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: rose-staging-db
                  property: connectionString
              - key: CACHE_URL
                fromService:
                  type: keyvalue
                  name: rose-staging-cache
                  property: connectionString
              - key: CELERY_BROKER_URL
                fromService:
                  type: keyvalue
                  name: rose-staging-cache
                  property: connectionString
          - type: worker
            name: rose-staging-worker
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            numInstances: 1
            dockerCommand: celery -A config worker --loglevel=info --concurrency=2
            envVars: *staging-env
          - type: worker
            name: rose-staging-beat
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            # Exactly one beat, or scheduled jobs (and emails) would run twice.
            numInstances: 1
            dockerCommand: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
            envVars: *staging-env
