# Render blueprint stub. Not deployed yet; prompt 5 finalises hosting.
# The static site proxies /api and /media to the API service, so the browser
# only ever talks to one origin and cookies stay first-party.
services:
  - type: web
    name: rose-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_ADMIN_PATH
        sync: false
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: rose-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: rose-cache
          property: connectionString
      - key: EMAIL_URL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: Rose
      - key: EMAIL_SENDER_ADDRESS
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_BASE_URL
        sync: false

  - type: keyvalue
    name: rose-cache
    plan: free
    ipAllowList: []

  - type: web
    name: rose-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_QUICK_EXIT_URL
        value: https://www.weather.gov/
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rose-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://rose-api.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /members/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /account/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /exit
        name: X-Robots-Tag
        value: noindex, nofollow

databases:
  - name: rose-db
    plan: basic-256mb
    databaseName: rose
    user: rose
