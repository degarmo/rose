# Render Blueprint: two environments (staging, production) of one project.
#
# Each environment runs one Docker image (./Dockerfile) as three services:
#   web     gunicorn; Django serves the site, the API, the admin and media views
#   worker  Celery (email, image processing, exports)
#   beat    Celery beat, exactly one instance (reminders, retention, backups)
# plus Render Postgres and Render Key Value (Redis).
#
# Secrets are declared with `sync: false` and never written here: Render asks
# for them when the Blueprint is created (docs/ops/deploy.md lists each one).
# The plans below are paid plans; creating this Blueprint creates billable
# resources, so it is applied by hand, never by CI.

projects:
  - name: rose
    environments:
      - name: staging
        envVarGroups:
          - name: rose-staging-settings
            envVars:
              - key: DJANGO_ENV
                value: staging
              - key: DJANGO_DEBUG
                value: "false"
              - key: DJANGO_TRUSTED_PROXY_COUNT
                value: "1"
              - key: STORAGE_BACKEND
                value: s3
              - key: S3_REGION
                value: auto
              # Staging takes in-person payments only; the sandbox cannot run here.
              - key: PAYMENT_PROVIDERS
                value: manual
              - key: EMAIL_PROVIDER
                value: postmark
              - key: BACKUP_ENABLED
                value: "true"
              - key: FEED_ENABLED
                value: "true"
          - name: rose-staging-secrets
            envVars:
              - key: DJANGO_SECRET_KEY
                sync: false
              # The club's name on the site, in email, on receipts and in calendar files.
              # Entered in the dashboard so it is never written into the repository.
              # EMAIL_SENDER_NAME, MERCHANT_DISPLAY_NAME and OTP_ISSUER follow it unless set.
              - key: SITE_NAME
                sync: false
              - key: DJANGO_ALLOWED_HOSTS
                sync: false
              - key: DJANGO_CSRF_TRUSTED_ORIGINS
                sync: false
              - key: DJANGO_ADMIN_PATH
                sync: false
              - key: SITE_URL
                sync: false
              - key: STAGING_BASIC_AUTH_USER
                sync: false
              - key: STAGING_BASIC_AUTH_PASSWORD
                sync: false
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: S3_PUBLIC_BUCKET
                sync: false
              - key: S3_PRIVATE_BUCKET
                sync: false
              - key: S3_PUBLIC_BASE_URL
                sync: false
              - key: POSTMARK_SERVER_TOKEN
                sync: false
              - key: EMAIL_SENDER_ADDRESS
                sync: false
              - key: CONTACT_NOTIFY_EMAIL
                sync: false
              - key: BACKUP_AGE_RECIPIENT
                sync: false
        databases:
          - name: rose-staging-db
            plan: basic-256mb
            postgresMajorVersion: "16"
            ipAllowList: []
        services:
          - type: keyvalue
            name: rose-staging-cache
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: []
          - type: web
            name: rose-staging-web
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            numInstances: 1
            healthCheckPath: /healthz
            preDeployCommand: >-
              python manage.py check --deploy --database default --fail-level ERROR
              && python manage.py migrate --noinput
            envVars: &staging-env
              - fromGroup: rose-staging-settings
              - fromGroup: rose-staging-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: rose-staging-db
                  property: connectionString
              - key: CACHE_URL
                fromService:
                  type: keyvalue
                  name: rose-staging-cache
                  property: connectionString
              - key: CELERY_BROKER_URL
                fromService:
                  type: keyvalue
                  name: rose-staging-cache
                  property: connectionString
          - type: worker
            name: rose-staging-worker
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            numInstances: 1
            dockerCommand: celery -A config worker --loglevel=info --concurrency=2
            envVars: *staging-env
          - type: worker
            name: rose-staging-beat
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            # Exactly one beat, or scheduled jobs (and emails) would run twice.
            numInstances: 1
            dockerCommand: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
            envVars: *staging-env

      - name: production
        envVarGroups:
          - name: rose-production-settings
            envVars:
              - key: DJANGO_ENV
                value: production
              - key: DJANGO_DEBUG
                value: "false"
              - key: DJANGO_TRUSTED_PROXY_COUNT
                value: "1"
              - key: STORAGE_BACKEND
                value: s3
              - key: S3_REGION
                value: auto
              # In person only until a real processor is chosen (docs/payments.md).
              - key: PAYMENT_PROVIDERS
                value: manual
              - key: EMAIL_PROVIDER
                value: postmark
              - key: BACKUP_ENABLED
                value: "true"
              - key: FEED_ENABLED
                value: "true"
              - key: MEMBERSHIP_GRACE_DAYS
                value: "7"
              - key: MEMBERSHIP_PENDING_EXPIRY_DAYS
                value: "30"
              - key: RSVP_RETENTION_DAYS
                value: "30"
              - key: CONTACT_RETENTION_DAYS
                value: "365"
          - name: rose-production-secrets
            envVars:
              - key: DJANGO_SECRET_KEY
                sync: false
              # The club's name on the site, in email, on receipts and in calendar files.
              # Entered in the dashboard so it is never written into the repository.
              # EMAIL_SENDER_NAME, MERCHANT_DISPLAY_NAME and OTP_ISSUER follow it unless set.
              - key: SITE_NAME
                sync: false
              - key: DJANGO_ALLOWED_HOSTS
                sync: false
              - key: DJANGO_CSRF_TRUSTED_ORIGINS
                sync: false
              - key: DJANGO_ADMIN_PATH
                sync: false
              - key: SITE_URL
                sync: false
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: S3_PUBLIC_BUCKET
                sync: false
              - key: S3_PRIVATE_BUCKET
                sync: false
              - key: S3_PUBLIC_BASE_URL
                sync: false
              - key: POSTMARK_SERVER_TOKEN
                sync: false
              - key: EMAIL_SENDER_ADDRESS
                sync: false
              - key: CONTACT_NOTIFY_EMAIL
                sync: false
              - key: BACKUP_AGE_RECIPIENT
                sync: false
        databases:
          - name: rose-production-db
            plan: basic-1gb
            postgresMajorVersion: "16"
            ipAllowList: []
        services:
          - type: keyvalue
            name: rose-production-cache
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: []
          - type: web
            name: rose-production-web
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: standard
            numInstances: 1
            healthCheckPath: /healthz
            preDeployCommand: >-
              python manage.py check --deploy --database default --fail-level ERROR
              && python manage.py migrate --noinput
            envVars: &production-env
              - fromGroup: rose-production-settings
              - fromGroup: rose-production-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: rose-production-db
                  property: connectionString
              - key: CACHE_URL
                fromService:
                  type: keyvalue
                  name: rose-production-cache
                  property: connectionString
              - key: CELERY_BROKER_URL
                fromService:
                  type: keyvalue
                  name: rose-production-cache
                  property: connectionString
          - type: worker
            name: rose-production-worker
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            numInstances: 1
            dockerCommand: celery -A config worker --loglevel=info --concurrency=2
            envVars: *production-env
          - type: worker
            name: rose-production-beat
            runtime: docker
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            # Exactly one beat, or scheduled jobs (and emails) would run twice.
            numInstances: 1
            dockerCommand: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
            envVars: *production-env
