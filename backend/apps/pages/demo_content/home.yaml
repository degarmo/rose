    lede: Education, social nights and community in a consent-first space in Chicago. Open to every experience level.
  who:
    title: Who we are
    lede:
      rich: >-
        <p>Rose is a volunteer-run nonprofit club with a members' venue on Chicago's north side.
        We host a class every Thursday, social evenings on Fridays and Saturdays, and workshops
        and community events through the month.</p>
        <p>We are inclusive, consent-first and non-judgmental. Nobody here will assume what you
        know or what you want. First-timers are welcome at every night we run.</p>
