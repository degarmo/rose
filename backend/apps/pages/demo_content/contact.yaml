copy:
  hero:
    eyebrow: Contact
    title: We would love to hear from you.
    lede: Questions, first-visit nerves, volunteering, or something that needs our attention. A real person reads every message.
  concern: Concerns go to a small safety team and are marked as a priority. Share as much or as little as you are comfortable with. If someone is in immediate danger, call 911.
  aside:
    title: Other ways to reach us
    note: Messages are stored privately and read only by the volunteers who answer them. Email notifications to our team never include what you wrote.
