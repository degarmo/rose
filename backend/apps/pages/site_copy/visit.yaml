page: visit
copy:
  hero:
    eyebrow: Plan your visit
    title: Plan your visit
    lede: Here is what a first evening looks like, start to finish, so there are no surprises.
  expect:
    eyebrow: What to expect
    title: What to expect
  steps:
    1:
      title: Arrive and check in
      body: A host greets you, checks your ID and walks you through the house rules. Five minutes, no rush.
    2:
      title: Settle in
      body: Tea and water are free. Classes start on time; social nights have no schedule.
    3:
      title: Leave when you like
      body: Stay ten minutes or the whole evening. A host is always near the door.
  id:
    title: Photo ID is required, every visit
    body: A government photo ID showing you are 18 or older. We look, we don't scan or copy. The name on your ID does not need to match the name you use with us.
  hours:
    title: Hours
  directions:
    title: Directions
  rules:
    eyebrow: House rules
    title: A few agreements everyone keeps.
    lede: Consent before contact, no photos, look after one another. The full list is short and worth reading before you come.
  faq:
    eyebrow: Questions
    title: Questions we get
    lede: Parking, what to wear, what to bring. The FAQ covers the usual first-visit questions.
