<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ newsletter.subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f3ef;color:#1d1718;font-family:Georgia,'Times New Roman',serif;">
{% if newsletter.preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ newsletter.preheader }}</div>{% endif %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ef;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;">
        <tr>
          <td style="padding:28px 28px 8px;font-size:17px;line-height:1.6;">
            {{ newsletter.body|safe }}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 28px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#6b5a57;border-top:1px solid #eee4dc;">
            You are receiving this because you confirmed this address for occasional updates.
            <a href="{{ unsubscribe_url }}" style="color:#6b5a57;">Unsubscribe in one click</a>.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
