{% extends "admin/rose/sign_in.html" %}

{% block sign_in %}
{% if form.errors and not error %}<p class="rose-alert" role="alert">{% for e in form.non_field_errors %}{{ e }}{% empty %}Check the email and password.{% endfor %}</p>{% endif %}
<form action="{{ app_path }}" method="post" id="login-form" class="rose-form">{% csrf_token %}
  <div class="rose-field">
    <label for="id_username">Email</label>
    <input type="email" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
  </div>
  <div class="rose-field">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
  </div>
  <button type="submit" class="rose-button">Continue</button>
</form>
<p class="rose-subtle rose-note">Staff accounts also need a code from an authenticator app.</p>
{% endblock %}
