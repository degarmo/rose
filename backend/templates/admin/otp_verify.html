{% extends "admin/rose/sign_in.html" %}

{% block sign_in %}
<form method="post" id="login-form" class="rose-form">{% csrf_token %}
  <div class="rose-field">
    <label for="{{ form.token.id_for_label }}">Six-digit code from your authenticator app, or a backup code</label>
    {{ form.token }}
  </div>
  <button type="submit" class="rose-button">Log in</button>
</form>
<p class="rose-subtle rose-note">Lost your phone? Use one of your backup codes. Each works once. If you have none left, ask another administrator to reset your two-step login.</p>
{% endblock %}
