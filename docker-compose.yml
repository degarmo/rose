# Full local development stack: Postgres, Redis, the API, a Celery worker,
# Celery beat, the Vite dev server, Mailpit (catches every email) and MinIO
# (an S3 stand-in for the storage tests). The repository is mounted at /srv so
# code changes reload. Nothing here is used in staging or production.
#
#   docker compose up                    # everything
#   docker compose up -d db cache minio  # only the services, to run the app on your machine
#
# Host ports default to Postgres 5433, Redis 6380, API 8000, site 5173, Mailpit
# 8025 and MinIO 9000. Override them with DB_PORT, CACHE_PORT, API_PORT,
# WEB_PORT, MAIL_PORT and MINIO_PORT if something else is using them.

x-backend: &backend
  build: ./backend
  image: rose-backend:dev
  working_dir: /srv/backend
  volumes:
    - ./:/srv
  environment:
    DJANGO_ENV: development
    DJANGO_SECRET_KEY: local-development-only-not-a-secret
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    DATABASE_URL: postgres://rose:rose@db:5432/rose
    CACHE_URL: redis://cache:6379/1
    CELERY_BROKER_URL: redis://cache:6379/0
    SITE_URL: http://localhost:${WEB_PORT:-5173}
    ADMIN_BASE_URL: http://localhost:${API_PORT:-8000}
    EMAIL_PROVIDER: smtp
    EMAIL_URL: smtp://mailpit:1025
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rose
      POSTGRES_USER: rose
      POSTGRES_PASSWORD: rose
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose -d rose"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "${CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAIL_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"

  minio:
    # The official MinIO images are no longer published; this archived build is
    # used only for development and tests (decision 190).
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-secret
      MINIO_DEFAULT_BUCKETS: rose-public:download,rose-private
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/bitnami/minio/data

  api:
    <<: *backend
    # The project's runserver applies migrations on every start and code reload, and warns
    # loudly about any it could not apply (apps/core/management/commands/runserver.py).
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  web:
    image: node:22-alpine
    working_dir: /srv/frontend
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./:/srv
      - web-node-modules:/srv/frontend/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
  minio-data:
