# Local services only. The app itself runs on your machine (see README).
# Host ports are offset (5433, 6380) so they do not clash with a locally
# installed Postgres or Redis.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rose
      POSTGRES_USER: rose
      POSTGRES_PASSWORD: rose
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose -d rose"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  db-data:
