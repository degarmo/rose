# Production-like stack for the end-to-end tests (e2e/) and CI.
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   cd e2e && npm test
#
# The app runs the production image (gunicorn, Django serving the built site,
# DEBUG off) against Postgres, Redis, MinIO (S3) and Mailpit, with a worker for
# image processing and email. DJANGO_ENV=e2e allows plain HTTP and the
# e2e_fixtures command; neither is possible in staging or production.

name: rose-e2e

x-app: &app
  build: .
  image: rose-app:e2e
  environment:
    DJANGO_ENV: e2e
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: e2e-only-key-not-a-secret-0123456789abcdefghijklmnop
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,app
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
    DJANGO_TRUSTED_PROXY_COUNT: "1"
    DATABASE_URL: postgres://rose:rose@db:5432/rose
    CACHE_URL: redis://cache:6379/1
    CELERY_BROKER_URL: redis://cache:6379/0
    SITE_URL: http://localhost:8080
    EMAIL_PROVIDER: smtp
    EMAIL_URL: smtp://mailpit:1025
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_BROWSER_ENDPOINT_URL: http://localhost:9100
    S3_PUBLIC_BASE_URL: http://localhost:9100/rose-public
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: minio-local
    S3_SECRET_ACCESS_KEY: minio-local-secret
    S3_PUBLIC_BUCKET: rose-public
    S3_PRIVATE_BUCKET: rose-private
    S3_ADDRESSING_STYLE: path
    PAYMENT_PROVIDERS: manual
    FEED_PREMODERATION_POSTS: "0"
    CONTACT_RATE_LIMIT: 3/h
    # The tests sign the same known accounts in many times an hour.
    LOGIN_RATE_LIMIT_EMAIL: 500/h
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rose
      POSTGRES_USER: rose
      POSTGRES_PASSWORD: rose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose -d rose"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-secret
      MINIO_DEFAULT_BUCKETS: rose-public:download,rose-private
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8125:8025"

  app:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py e2e_fixtures
      && gunicorn config.wsgi:application --config gunicorn.conf.py"
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
